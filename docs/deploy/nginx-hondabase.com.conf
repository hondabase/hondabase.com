# Mirror of the live nginx vhost at /etc/nginx/sites-enabled/hondabase.com.
# Not loaded from here: edit the live file as root, run `nginx -t && systemctl reload nginx`,
# then copy it back over this mirror so the repo tracks server intent.

# HTTP -> HTTPS redirect for www and non-www
server {
    listen 80;
    listen [::]:80;
    server_name hondabase.com www.hondabase.com;

    access_log /var/log/nginx/hondabase_redirect.access.log;
    error_log /var/log/nginx/hondabase_redirect.error.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    return 301 https://www.hondabase.com$request_uri;
}

# HTTPS redirect non-www -> www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hondabase.com;

    ssl_certificate /etc/letsencrypt/live/hondabase.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hondabase.com/privkey.pem;
    include snippets/ssl-params.conf;

    access_log /var/log/nginx/hondabase_redirect.access.log;
    error_log /var/log/nginx/hondabase_redirect.error.log;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    return 301 https://www.hondabase.com$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hondabase.com;

    ssl_certificate /etc/letsencrypt/live/hondabase.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hondabase.com/privkey.pem;
    include snippets/ssl-params.conf;

    root /var/www/hondabase/www/public;
    index index.php index.html;

    access_log /var/log/nginx/hondabase.access.log;
    error_log /var/log/nginx/hondabase.error.log;

    # Redirect legacy wideband guide to dynamic article
    location ~* ^/guides/how-to-wire-wideband/obd1/?(index\.php)?$ {
        return 301 /cars/electronics/how-to-wire-wideband;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Legacy pgmfi.org app (landing, wiki, forum): kept online but deindexed.
    # `^~` opts this URI space out of regex matching (incl. snippets/php.conf),
    # so the X-Robots-Tag header applies to PHP responses too; PHP execution
    # therefore needs its own nested handler, same pattern as the archive
    # forum block below. add_header at location level discards server-level
    # headers, so HSTS is re-declared here.
    location ^~ /pgmfi/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.php?$args;

        location /pgmfi/wiki/ {
            try_files $uri $uri/ /pgmfi/wiki/index.php?$args;
        }

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        }
    }

    # Legacy pgmfi.org forum archive (flat PHP viewer): deindexed like /pgmfi/.
    # /pgmfi-archive/forum/ has its own longer-prefix block below.
    location ^~ /pgmfi-archive/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.php?$args;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        }
    }

    # /var/www/hondabase/www/public/pgmfi-archive/forum is a symlink to the
    # actual Flarum install's public/ dir, so this uses the site's own `root`
    # (inherited from the server block) instead of `alias` - the same
    # try_files-into-index.php pattern already proven above for `location /`
    # and `location /pgmfi/wiki/`, which sidesteps `alias`'s well-known
    # interaction with try_files' URI-fallback form.
    location ^~ /pgmfi-archive/forum/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /pgmfi-archive/forum/index.php?$query_string;

        location ~ ^/pgmfi-archive/forum/(storage|vendor|composer\.(json|lock)|auth\.json|config\.php|flarum|site\.php)($|/) {
            deny all;
        }

        # `^~` on the parent block opts this whole URI space out of regex
        # location matching, including the site-wide PHP handler below - so
        # PHP execution needs its own copy here, or index.php would be
        # served as static source instead of being run.
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        }
    }

    include snippets/php.conf;

    location ~ /\.ht {
        deny all;
    }
}
